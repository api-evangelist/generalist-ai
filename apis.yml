aid: generalist-ai
name: Generalist AI
description: 'Generalist AI, Inc. is a frontier AI research and product-driven company
  building general intelligence for the physical world — training robots that work
  autonomously across factories, warehouses, laboratories, restaurants, farms, homes,
  and beyond. Its flagship model, GEN-1, is a general-purpose embodied foundation
  model trained from scratch that reaches mastery of simple physical tasks, going
  beyond world models and vision-language-action (VLA) approaches. Backed by Spark
  Capital, the company publishes its research through a blog and open-sources vision
  and robotics tooling on GitHub. Generalist AI exposes no public developer API, SDK,
  or documentation surface at this time; this profile captures its identity and web
  properties for the API Evangelist network.'
